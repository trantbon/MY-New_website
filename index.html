<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoastBot 🔥 | Smart Answers, Zero Mercy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #090d16 60%, #1c100b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .chat-container {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(251, 146, 60, 0.25);
      width: 100%;
      max-width: 700px;
      height: 86vh;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(249, 115, 22, 0.12);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: rgba(2, 6, 23, 0.75);
      padding: 1.1rem 1.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.45);
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(to right, #fb923c, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .intensity-select {
      background: rgba(30, 41, 59, 0.85);
      color: #fdba74;
      border: 1px solid rgba(251, 146, 60, 0.35);
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .intensity-select:focus {
      border-color: #f97316;
    }

    .clear-btn {
      background: rgba(51, 65, 85, 0.5);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 0.45rem 0.85rem;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    /* Chat Area */
    .messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeSlide 0.25s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .sender-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #64748b;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background: rgba(148, 163, 184, 0.15);
      color: #f8fafc;
    }

    .bubble {
      padding: 0.85rem 1.15rem;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
    }

    .bot .bubble {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.15);
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
    }

    /* Quick Prompts */
    .suggestions {
      display: flex;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      overflow-x: auto;
      background: rgba(2, 6, 23, 0.4);
      border-top: 1px solid rgba(148, 163, 184, 0.08);
    }

    .suggestions::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(30, 41, 59, 0.8);
      color: #cbd5e1;
      border: 1px solid rgba(251, 146, 60, 0.25);
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: rgba(249, 115, 22, 0.2);
      color: #fdba74;
      border-color: #f97316;
    }

    /* Input Area */
    .input-area {
      display: flex;
      padding: 1rem 1.25rem;
      background: rgba(2, 6, 23, 0.85);
      gap: 0.65rem;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
    }

    input {
      flex: 1;
      padding: 0.85rem 1.1rem;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
    }

    button#send-btn {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      border: none;
      padding: 0 1.4rem;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
    }

    button#send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
    }

    button#send-btn:disabled {
      background: #334155;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div class="brand">
        <div class="logo-badge">🔥</div>
        <div class="brand-text">
          <h1>RoastBot</h1>
          <p>Accurate answers served with zero mercy</p>
        </div>
      </div>
      <div class="controls">
        <select class="intensity-select" id="intensity-select" aria-label="Roast Intensity">
          <option value="mild">🌶️ Mild</option>
          <option value="spicy" selected>🔥 Spicy</option>
          <option value="savage">💀 Savage</option>
        </select>
        <button class="clear-btn" id="clear-btn" title="Reset chat">Clear</button>
      </div>
    </div>

    <div class="messages" id="chat-box">
      <div class="msg-row bot">
        <div class="msg-header">
          <span class="sender-label">RoastBot</span>
        </div>
        <div class="bubble">Pick your heat level above and ask me anything—I'll give you the right answer and roast your life choices for free.</div>
      </div>
    </div>

    <div class="suggestions">
      <button class="chip" onclick="usePrompt('Why is the sky blue?')">Why is the sky blue?</button>
      <button class="chip" onclick="usePrompt('What is 15% of 80?')">What is 15% of 80?</button>
      <button class="chip" onclick="usePrompt('How do I get better at coding?')">How do I get better at coding?</button>
      <button class="chip" onclick="usePrompt('Tell me a fun fact')">Tell me a fun fact</button>
    </div>

    <form class="input-area" id="chat-form">
      <input type="text" id="user-input" placeholder="Ask a question or say something..." autocomplete="off" required />
      <button type="submit" id="send-btn">Roast 🔥</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");
    const intensitySelect = document.getElementById("intensity-select");

    const intensityStyles = {
      mild: "Keep the roast playful, friendly, and gentle—like teasing a close friend.",
      spicy: "Deliver a sharp, witty, sarcastic roast with clever stand-up comedian energy.",
      savage: "Go full ruthless stand-up roast mode—maximum sarcasm and dramatic mockery while staying strictly PG-13 and free of hate speech, slurs, or genuine harm."
    };

    function getSystemPrompt() {
      const level = intensitySelect.value;
      return (
        "You are RoastBot: a razor-sharp, sarcastic genius comedian.\n" +
        "Rules:\n" +
        "1. If the user asks a factual, math, coding, or general knowledge question, ALWAYS give the 100% accurate, helpful answer—never lie or make up wrong facts.\n" +
        "2. At the exact same time, roast the user for asking it, how they phrased it, or what they said. Weave the correct answer and the roast together naturally.\n" +
        "3. Tone instruction: " + intensityStyles[level] + "\n" +
        "4. Keep responses punchy and entertaining."
      );
    }

    let conversation = [{ role: "system", content: getSystemPrompt() }];

    intensitySelect.addEventListener("change", () => {
      conversation[0].content = getSystemPrompt();
    });

    function addBubble(text, sender, showCopy = false) {
      const row = document.createElement("div");
      row.className = `msg-row ${sender}`;

      const msgHeader = document.createElement("div");
      msgHeader.className = "msg-header";

      const label = document.createElement("span");
      label.className = "sender-label";
      label.textContent = sender === "user" ? "You" : "RoastBot";
      msgHeader.appendChild(label);

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (showCopy) {
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "copy-btn";
        copyBtn.textContent = "Copy";
        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(bubble.textContent);
          copyBtn.textContent = "Copied!";
          setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
        });
        msgHeader.appendChild(copyBtn);
      }

      row.appendChild(msgHeader);
      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    function usePrompt(text) {
      userInput.value = text;
      chatForm.dispatchEvent(new Event("submit"));
    }

    clearBtn.addEventListener("click", () => {
      conversation = [{ role: "system", content: getSystemPrompt() }];
      chatBox.innerHTML = "";
      addBubble("Fresh start. Try asking something smarter this time.", "bot", false);
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      conversation[0].content = getSystemPrompt();
      addBubble(text, "user", false);
      conversation.push({ role: "user", content: text });
      userInput.value = "";
      sendBtn.disabled = true;

      const loadingBubble = addBubble("Cooking up a roast...", "bot", true);

      try {
        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: conversation,
            model: "openai",
            seed: Math.floor(Math.random() * 10000)
          })
        });

        if (!response.ok) throw new Error("Server busy");

        const reply = await response.text();
        loadingBubble.textContent = reply;
        conversation.push({ role: "assistant", content: reply });
      } catch (err) {
        loadingBubble.textContent =
          "My brain lagged harder than your Wi-Fi. Hit send again!";
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
