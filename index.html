<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoastBot 🔥</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .chat-container {
      background: #1e293b;
      width: 100%;
      max-width: 600px;
      height: 80vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .header {
      background: #020617;
      padding: 1.25rem;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    .header h1 { margin: 0; font-size: 1.5rem; color: #f97316; }
    .header p { margin: 0.25rem 0 0; font-size: 0.9rem; color: #94a3b8; }
    .messages {
      flex: 1;
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .bubble {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .user {
      background: #38bdf8;
      color: #0f172a;
      align-self: flex-end;
      font-weight: 500;
    }
    .bot {
      background: #334155;
      color: #f8fafc;
      align-self: flex-start;
    }
    .input-area {
      display: flex;
      padding: 1rem;
      background: #020617;
      gap: 0.5rem;
    }
    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
    }
    input:focus { border-color: #f97316; }
    button {
      background: #f97316;
      color: #fff;
      border: none;
      padding: 0 1.25rem;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #ea580c; }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <h1>🔥 RoastBot</h1>
      <p>Say something. Anything. I dare you.</p>
    </div>

    <div class="messages" id="chat-box">
      <div class="bubble bot">Go ahead, type something so I can ruin your confidence.</div>
    </div>

    <form class="input-area" id="chat-form">
      <input type="text" id="user-input" placeholder="Type something to get roasted..." required />
      <button type="submit" id="send-btn">Roast</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    const systemPrompt =
      "You are a witty, sarcastic stand-up comedian whose job is to playfully roast " +
      "whatever the user says. Keep your roasts clever, punchy, and lighthearted—never " +
      "cross the line into genuine cruelty, hate speech, or personal attacks.";

    let conversation = [{ role: "system", content: systemPrompt }];

    function addBubble(text, sender) {
      const div = document.createElement("div");
      div.className = `bubble ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      addBubble(text, "user");
      conversation.push({ role: "user", content: text });
      userInput.value = "";
      sendBtn.disabled = true;

      const loadingBubble = addBubble("Thinking of a roast...", "bot");

      try {
        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: conversation,
            model: "openai",
            seed: Math.floor(Math.random() * 10000)
          })
        });

        if (!response.ok) throw new Error("Server busy");

        const reply = await response.text();
        loadingBubble.textContent = reply;
        conversation.push({ role: "assistant", content: reply });
      } catch (err) {
        loadingBubble.textContent =
          "Even my circuits got bored waiting. Try sending that again!";
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
