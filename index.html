<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoastBot 🔥 | Smart Answers, Zero Mercy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #090d16 60%, #1c100b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .chat-container {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(251, 146, 60, 0.28);
      width: 100%;
      max-width: 720px;
      height: 90vh;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(249, 115, 22, 0.14);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: rgba(2, 6, 23, 0.8);
      padding: 1rem 1.35rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.45);
    }

    .brand-text h1 {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(to right, #fb923c, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 0.76rem;
      color: #94a3b8;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .intensity-select, .icon-btn, .clear-btn {
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 0.42rem 0.75rem;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .intensity-select {
      color: #fdba74;
      border-color: rgba(251, 146, 60, 0.35);
    }

    .icon-btn:hover, .clear-btn:hover {
      border-color: #f97316;
      color: #fff;
    }

    /* Ego HP Bar */
    .ego-bar-wrapper {
      background: rgba(2, 6, 23, 0.6);
      padding: 0.6rem 1.35rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .ego-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
      min-width: 115px;
    }

    .ego-track {
      flex: 1;
      height: 10px;
      background: rgba(30, 41, 59, 0.95);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .ego-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #eab308);
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background 0.45s ease;
    }

    .revive-btn {
      display: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      border: none;
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Chat Area */
    .messages {
      flex: 1;
      padding: 1.35rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      animation: fadeSlide 0.25s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.bot { align-self: flex-start; align-items: flex-start; }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .sender-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #64748b;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background: rgba(249, 115, 22, 0.2);
      color: #fdba74;
    }

    .bubble {
      padding: 0.85rem 1.15rem;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
    }

    .bot .bubble {
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.16);
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
    }

    .burn-badge {
      display: inline-block;
      margin-top: 0.55rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(249, 115, 22, 0.18);
      border: 1px solid rgba(249, 115, 22, 0.45);
      color: #fdba74;
    }

    /* Quick Prompts */
    .suggestions {
      display: flex;
      gap: 0.5rem;
      padding: 0.6rem 1.25rem;
      overflow-x: auto;
      background: rgba(2, 6, 23, 0.45);
      border-top: 1px solid rgba(148, 163, 184, 0.08);
    }

    .suggestions::-webkit-scrollbar { display: none; }

    .chip {
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      border: 1px solid rgba(251, 146, 60, 0.25);
      padding: 0.38rem 0.78rem;
      border-radius: 999px;
      font-size: 0.76rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: rgba(249, 115, 22, 0.22);
      color: #fdba74;
      border-color: #f97316;
    }

    /* Input Area */
    .input-area {
      display: flex;
      padding: 0.95rem 1.25rem;
      background: rgba(2, 6, 23, 0.88);
      gap: 0.65rem;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
    }

    input {
      flex: 1;
      padding: 0.82rem 1.05rem;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
    }

    button#send-btn {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      border: none;
      padding: 0 1.35rem;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
    }

    button#send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.5);
    }

    button#send-btn:disabled {
      background: #334155;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div class="brand">
        <div class="logo-badge">🔥</div>
        <div class="brand-text">
          <h1>RoastBot</h1>
          <p>Smart answers, zero mercy 💀</p>
        </div>
      </div>
      <div class="controls">
        <select class="intensity-select" id="intensity-select" aria-label="Roast Intensity">
          <option value="mild">🌶️ Mild</option>
          <option value="spicy" selected>🔥 Spicy</option>
          <option value="savage">💀 Savage</option>
        </select>
        <button class="icon-btn" id="sound-btn" title="Toggle sound effects">🔊 SFX</button>
        <button class="clear-btn" id="clear-btn" title="Reset chat">Clear</button>
      </div>
    </div>

    <div class="ego-bar-wrapper">
      <span class="ego-label" id="ego-label">🛡️ Ego HP: 100%</span>
      <div class="ego-track">
        <div class="ego-fill" id="ego-fill"></div>
      </div>
      <button class="revive-btn" id="revive-btn">❤️ Revive Ego</button>
    </div>

    <div class="messages" id="chat-box">
      <div class="msg-row bot">
        <div class="msg-header">
          <span class="sender-label">RoastBot</span>
        </div>
        <div class="bubble">Your Ego HP starts at 100% 🛡️. Ask me a real question or pick a Roast Challenge below—let's see how long you survive 😭🔥</div>
      </div>
    </div>

    <div class="suggestions">
      <button class="chip" onclick="usePrompt('Roast my sleep schedule—I stay up way too late')">😴 Roast my sleep schedule</button>
      <button class="chip" onclick="usePrompt('Roast my screen time—I am on my phone all day')">📱 Roast my screen time</button>
      <button class="chip" onclick="usePrompt('Roast my music taste')">🎧 Roast my music taste</button>
      <button class="chip" onclick="usePrompt('Why is the sky blue?')">🌤️ Why is the sky blue?</button>
      <button class="chip" onclick="usePrompt('What is 15% of 80?')">🧮 What is 15% of 80?</button>
    </div>

    <form class="input-area" id="chat-form">
      <input type="text" id="user-input" placeholder="Ask a question or dare me to roast you..." autocomplete="off" required />
      <button type="submit" id="send-btn">Roast 🔥</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");
    const intensitySelect = document.getElementById("intensity-select");
    const soundBtn = document.getElementById("sound-btn");
    const egoLabel = document.getElementById("ego-label");
    const egoFill = document.getElementById("ego-fill");
    const reviveBtn = document.getElementById("revive-btn");

    let egoHP = 100;
    let soundEnabled = true;

    // Built-in Web Audio API Sound Effects (no external audio files needed)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === "send") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.09);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === "burn") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(95, now + 0.25);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊 SFX" : "🔇 Muted";
    });

    function updateEgo(damage) {
      egoHP = Math.max(0, egoHP - damage);
      egoFill.style.width = `${egoHP}%`;

      if (egoHP > 60) {
        egoFill.style.background = "linear-gradient(90deg, #22c55e, #84cc16)";
        egoLabel.textContent = `🛡️ Ego HP: ${egoHP}%`;
      } else if (egoHP > 25) {
        egoFill.style.background = "linear-gradient(90deg, #f59e0b, #f97316)";
        egoLabel.textContent = `⚠️ Ego HP: ${egoHP}%`;
      } else if (egoHP > 0) {
        egoFill.style.background = "linear-gradient(90deg, #ef4444, #dc2626)";
        egoLabel.textContent = `🔥 Ego HP: ${egoHP}%`;
      } else {
        egoFill.style.background = "#ef4444";
        egoLabel.textContent = `💀 Ego Destroyed!`;
        reviveBtn.style.display = "inline-block";
      }
    }

    reviveBtn.addEventListener("click", () => {
      egoHP = 100;
      egoFill.style.width = "100%";
      egoFill.style.background = "linear-gradient(90deg, #22c55e, #eab308)";
      egoLabel.textContent = "🛡️ Ego HP: 100%";
      reviveBtn.style.display = "none";
      addBubble("Ego revived to 100% ❤️—try not to lose it all in two messages this time 🤡", "bot", false);
    });

    const intensityStyles = {
      mild: "Keep the roast playful, friendly, and gentle—like teasing a close friend.",
      spicy: "Deliver a sharp, witty, sarcastic roast with clever stand-up comedian energy.",
      savage: "Go full ruthless stand-up roast mode—maximum sarcasm and dramatic mockery while staying strictly PG-13 and free of hate speech, slurs, or genuine harm."
    };

    function getSystemPrompt() {
      const level = intensitySelect.value;
      return (
        "You are RoastBot: a razor-sharp, sarcastic comedian who loves using expressive emojis (like 💀, 😭, 🤡, 🔥, 👀, 🫠).\n" +
        "Rules:\n" +
        "1. If the user asks a factual, math, coding, or general knowledge question, ALWAYS give the 100% accurate, helpful answer—never lie or make up wrong facts.\n" +
        "2. At the exact same time, roast the user for asking it, how they phrased it, or what they said. Use 2 to 4 well-placed emojis naturally inside your reply.\n" +
        "3. Tone instruction: " + intensityStyles[level] + "\n" +
        "4. On a brand-new final line at the very end of every reply, output ONLY a burn score in this exact format: BURN_SCORE: X/10 (where X is a number from 5 to 10 based on how hard you roasted them)."
      );
    }

    let conversation = [{ role: "system", content: getSystemPrompt() }];

    intensitySelect.addEventListener("change", () => {
      conversation[0].content = getSystemPrompt();
    });

    // Generate a shareable PNG Roast Card using HTML5 Canvas
    function downloadRoastCard(roastText, scoreText) {
      const canvas = document.createElement("canvas");
      canvas.width = 800;
      canvas.height = 460;
      const ctx = canvas.getContext("2d");

      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, 800, 460);
      grad.addColorStop(0, "#1e1b4b");
      grad.addColorStop(0.5, "#0f172a");
      grad.addColorStop(1, "#2a120a");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 800, 460);

      // Border
      ctx.strokeStyle = "#f97316";
      ctx.lineWidth = 4;
      ctx.strokeRect(18, 18, 764, 424);

      // Header
      ctx.fillStyle = "#fb923c";
      ctx.font = "bold 28px Inter, sans-serif";
      ctx.fillText("🔥 RoastBot", 45, 68);

      if (scoreText) {
        ctx.fillStyle = "#fca5a5";
        ctx.font = "bold 20px Inter, sans-serif";
        ctx.fillText(scoreText, 560, 68);
      }

      // Wrap roast text
      ctx.fillStyle = "#f8fafc";
      ctx.font = "22px Inter, sans-serif";
      const words = roastText.split(" ");
      let line = "";
      let y = 130;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + " ";
        if (ctx.measureText(testLine).width > 700 && n > 0) {
          ctx.fillText(line, 45, y);
          line = words[n] + " ";
          y += 34;
          if (y > 370) {
            line += "...";
            break;
          }
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, 45, y);

      // Footer
      ctx.fillStyle = "#94a3b8";
      ctx.font = "16px Inter, sans-serif";
      ctx.fillText("trantbon.github.io/MY-New_website", 45, 415);

      const link = document.createElement("a");
      link.download = "roastbot-card.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function addBubble(text, sender, showActions = false) {
      const row = document.createElement("div");
      row.className = `msg-row ${sender}`;

      const msgHeader = document.createElement("div");
      msgHeader.className = "msg-header";

      const label = document.createElement("span");
      label.className = "sender-label";
      label.textContent = sender === "user" ? "You" : "RoastBot";
      msgHeader.appendChild(label);

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (showActions) {
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "action-btn";
        copyBtn.textContent = "Copy";
        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(bubble.dataset.cleanText || bubble.textContent);
          copyBtn.textContent = "Copied!";
          setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
        });

        const cardBtn = document.createElement("button");
        cardBtn.type = "button";
        cardBtn.className = "action-btn";
        cardBtn.textContent = "📸 Share Card";
        cardBtn.addEventListener("click", () => {
          downloadRoastCard(
            bubble.dataset.cleanText || bubble.textContent,
            bubble.dataset.scoreText || ""
          );
        });

        msgHeader.appendChild(copyBtn);
        msgHeader.appendChild(cardBtn);
      }

      row.appendChild(msgHeader);
      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubble;
    }

    // Typewriter animation for bot replies
    function typeReply(bubble, fullText, scoreNumber) {
      return new Promise((resolve) => {
        bubble.textContent = "";
        bubble.dataset.cleanText = fullText;
        let i = 0;
        const speed = 14;
        const timer = setInterval(() => {
          bubble.textContent += fullText.charAt(i);
          i++;
          chatBox.scrollTop = chatBox.scrollHeight;
          if (i >= fullText.length) {
            clearInterval(timer);
            if (scoreNumber) {
              const badge = document.createElement("div");
              badge.className = "burn-badge";
              const scoreLabel = `🔥 Burn Rating: ${scoreNumber}/10`;
              badge.textContent = scoreLabel;
              bubble.dataset.scoreText = scoreLabel;
              bubble.appendChild(document.createElement("br"));
              bubble.appendChild(badge);
              chatBox.scrollTop = chatBox.scrollHeight;
            }
            resolve();
          }
        }, speed);
      });
    }

    function usePrompt(text) {
      userInput.value = text;
      chatForm.dispatchEvent(new Event("submit"));
    }

    clearBtn.addEventListener("click", () => {
      conversation = [{ role: "system", content: getSystemPrompt() }];
      chatBox.innerHTML = "";
      addBubble("Fresh start 🧹. Your Ego HP is still at " + egoHP + "%—try asking something smarter this time.", "bot", false);
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      playTone("send");
      conversation[0].content = getSystemPrompt();
      addBubble(text, "user", false);
      conversation.push({ role: "user", content: text });
      userInput.value = "";
      sendBtn.disabled = true;

      const loadingBubble = addBubble("Cooking up a roast... 🔥", "bot", true);

      try {
        let rawReply = "";

        // Attempt 1: Standard POST request with full conversation history
        try {
          const response = await fetch("https://text.pollinations.ai/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: conversation,
              model: "openai",
              seed: Math.floor(Math.random() * 10000)
            })
          });
          if (!response.ok) throw new Error("POST status " + response.status);
          rawReply = await response.text();
        } catch (postErr) {
          console.warn("POST failed, switching to GET fallback:", postErr);
          // Attempt 2: Simpler GET request fallback
          const fullPrompt = `${getSystemPrompt()}\n\nUser says: "${text}"`;
          const getUrl = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=openai&seed=${Math.floor(Math.random() * 10000)}`;
          const fallbackRes = await fetch(getUrl);
          if (!fallbackRes.ok) throw new Error("GET status " + fallbackRes.status);
          rawReply = await fallbackRes.text();
        }

        conversation.push({ role: "assistant", content: rawReply });

        // Extract BURN_SCORE: X/10 if present
        let score = Math.floor(Math.random() * 4) + 6; // fallback 6-9
        const scoreMatch = rawReply.match(/BURN_SCORE:\s*(\d+)\s*\/\s*10/i);
        if (scoreMatch) {
          score = Math.min(10, Math.max(1, parseInt(scoreMatch[1], 10)));
        }
        const cleanReply = rawReply.replace(/BURN_SCORE:\s*\d+\s*\/\s*10/i, "").trim();

        playTone("burn");
        await typeReply(loadingBubble, cleanReply, score);
        updateEgo(score * 3); // Drains 15% to 30% Ego HP per roast
      } catch (err) {
        console.error("Both POST and GET failed:", err);
        loadingBubble.textContent =
          "My brain lagged harder than your Wi-Fi 🫠. Hit send again!";
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
